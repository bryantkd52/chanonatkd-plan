<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover" />
  <title>ChanonaTKD • Plan</title>
  <link rel="stylesheet" href="./styles.css?v=ui-redesign-20260719-3">
  <link rel="stylesheet" href="./section-toggles.css?v=ui-redesign-20260719-1">
  <link rel="stylesheet" href="./system-tabs.css?v=system-tabs-20260727-poomsae-1">
</head>
<body id="inicio">
  <div class="appShell">
    <header class="hero">
      <nav class="topbar">
        <a class="brand" href="#inicio" aria-label="Ir al inicio del plan">
          <img class="logoImg" id="logoImg" alt="ChanonaTKD Logo" />
          <div class="brandText">
            <h1>ChanonaTKD • Plan</h1>
            <p id="brandSub">Cargando alumno…</p>
          </div>
        </a>
        <button class="btn themeBtn" id="themeToggle" type="button">☀️ Claro</button>
      </nav>

      <section class="heroGrid">
        <div class="studentCard">
          <p class="eyebrow">Alumno / Grupo</p>
          <h2 id="planTitle">Plan • Cargando…</h2>
          <div class="sub" id="planSub">Cargando ciclo y alumno…</div>
          <div class="chipRow">
            <span class="chip red" id="chipFocus">🎯 Enfoque: —</span>
            <span class="chip" id="chipUpdated">🕒 —</span>
            <span class="chip" id="chipSubscription">💳 —</span>
          </div>
          <p class="goal" id="goalText"></p>
          <div class="heroActions">
            <a class="action primary" id="trainingLink" href="#" target="_blank" rel="noreferrer">🎥 Entrar a mi entrenamiento</a>
            <button class="action" id="scrollTodayBtn" type="button">✅ Marcar entrenamiento</button>
          </div>
        </div>

        <aside class="renewalCard" id="renewalCard" hidden>
          <div class="cardIcon">🔔</div>
          <div>
            <strong id="renewalTitle">Recordatorio de renovación</strong>
            <p id="renewalText">Tu acceso se renueva pronto.</p>
          </div>
          <button id="closeRenewal" class="action smallAction" type="button">Cerrar</button>
        </aside>
      </section>
    </header>

    <main class="main">
      <div class="content" id="content">
        <div class="loaderCard">
          <div class="loaderTitle">Cargando tu plan…</div>
          <div class="loaderSub">Si no carga, revisa el link del alumno.</div>
        </div>
      </div>
    </main>
  </div>

  <script src="./app.js?v=ui-redesign-20260719"></script>
  <script src="./system-tabs.js?v=system-tabs-20260727-poomsae-1"></script>
  <script src="./section-toggles.js?v=ui-redesign-20260719-1"></script>
</body>
</html>
